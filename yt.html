<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- YouTube needs to see which site the player is on (otherwise "Error 153") – this page gives it one -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Zappio player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="p"></div>
<script>
(function () {
  'use strict';
  // Zappio's YouTube player: plays one video (trailer or live stream) inside the Zappio TV app.
  // Zappio sends commands (play/pause, seek) and gets told when the video ends or fails.
  var q = {}; location.hash.slice(1).split('&').forEach(function (p) { var i = p.indexOf('='); if (i > 0) q[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); });
  var id = /^[\w-]{11}$/.test(q.v || '') ? q.v : '';
  var player = null;
  function tell(m) { try { parent.postMessage(Object.assign({ zp: 1 }, m), '*'); } catch (e) {} }
  if (!id) { tell({ ev: 'error', code: 'id' }); return; }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      videoId: id, width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, fs: 0, disablekb: 1, hl: q.l || 'en', cc_lang_pref: q.l || 'en' },
      events: {
        onReady: function () { player.playVideo(); tell({ ev: 'ready', live: !!(player.getVideoData && player.getVideoData().isLive) });
          // Some TVs block sound on autoplay: start muted rather than not at all
          setTimeout(function () { if (player.getPlayerState() !== 1) { player.mute(); player.playVideo(); tell({ ev: 'muted' }); } }, 2500); },
        onStateChange: function (e) { tell({ ev: 'state', s: e.data }); if (e.data === 0) tell({ ev: 'ended' }); },
        onError: function (e) { tell({ ev: 'error', code: e.data }); }
      }
    });
  };
  window.addEventListener('message', function (e) {
    var d = e.data || {}; if (!player || !d.zp || !d.cmd) return;
    try {
      if (d.cmd === 'toggle') { if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); }
      else if (d.cmd === 'seek') player.seekTo(Math.max(0, player.getCurrentTime() + d.s), true);
      else if (d.cmd === 'unmute') { player.unMute(); player.setVolume(100); }
      else if (d.cmd === 'time') tell({ ev: 'time', t: player.getCurrentTime(), d: player.getDuration() });
    } catch (x) {}
  });
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
})();
</script>
</body>
</html>
